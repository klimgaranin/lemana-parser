[project]
name = "lemana-parser"
version = "0.1.0"
description = "Windows-first HTML parser for lemanapro.ru catalog exports."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lemana_parser", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]

